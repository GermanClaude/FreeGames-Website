# NULLPUNKT — Android-App bauen (mobile/, Capacitor). Läuft bei einem Versions-Tag (v1.2.3) oder von Hand
# (Actions → „Android-App bauen“ → Run workflow). Die Webseite (GitHub Pages) wird nicht angefasst.
# Die App ist eine schlanke Hülle: sie lädt die Webseite (capacitor.config.json server.url) – Handy-App, Browser,
# PC-App und VR spielen so immer dieselbe Spielfassung; offline übernimmt der Service Worker (sw.js).
# Ergebnis: NULLPUNKT-android.apk (fester Name, damit …/releases/latest/download/NULLPUNKT-android.apk immer passt).
# Signatur: Sind die Secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# gesetzt, wird ein Release-APK mit diesem Schlüssel gebaut (Updates installieren sich dann über die alte Version).
# Ohne Secrets: Debug-APK (debug-signiert, wechselnder Schlüssel – vor einem Update die alte App deinstallieren).
name: Android-App bauen

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Versions-Tag für ein Release (z. B. v1.0.0) – leer = nur Artefakte bauen'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: mobile
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest bringt das Android-SDK mit (ANDROID_HOME); fehlende Plattformen lädt Gradle selbst
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Abhängigkeiten
        run: npm install --no-audit --no-fund

      - name: Android-Projekt erzeugen und anpassen
        run: |
          npx cap add android
          export APP_VERSION="${GITHUB_REF_NAME}"
          if [[ -n "${{ inputs.release_tag }}" ]]; then export APP_VERSION="${{ inputs.release_tag }}"; fi
          [[ "$GITHUB_REF" == refs/tags/v* || -n "${{ inputs.release_tag }}" ]] || export APP_VERSION="$(node -p "require('./package.json').version")"
          APP_VERSION_CODE="${GITHUB_RUN_NUMBER}" node scripts/patch-android.mjs
          npx cap sync android

      - name: Signaturschlüssel
        if: env.HAS_KEY == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/nullpunkt.keystore"
          echo "NULLPUNKT_KEYSTORE=$RUNNER_TEMP/nullpunkt.keystore" >> "$GITHUB_ENV"

      - name: Bauen (Release, signiert)
        if: env.HAS_KEY == 'true'
        working-directory: mobile/android
        env:
          NULLPUNKT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NULLPUNKT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NULLPUNKT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../dist && cp app/build/outputs/apk/release/app-release.apk ../dist/NULLPUNKT-android.apk

      - name: Bauen (Debug)
        if: env.HAS_KEY != 'true'
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../dist && cp app/build/outputs/apk/debug/app-debug.apk ../dist/NULLPUNKT-android.apk

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: nullpunkt-android
          path: mobile/dist/NULLPUNKT-android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Release (bei Tags oder mit release_tag)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: NULLPUNKT ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: mobile/dist/NULLPUNKT-android.apk
          fail_on_unmatched_files: true
          body: |
            NULLPUNKT – kostenlos, ohne Konto. Alle Plattformen spielen zusammen.
            Windows: `NULLPUNKT-Setup.exe` (Installer) oder `NULLPUNKT-portable.exe` (ohne Installation) – nicht signiert, SmartScreen: „Weitere Informationen“ → „Trotzdem ausführen“.
            Linux: `NULLPUNKT-linux.AppImage` (ausführbar machen, starten).
            Android: `NULLPUNKT-android.apk` – Android fragt nach „Unbekannte Apps installieren“; für den Browser einmal erlauben.
            Leichter geht’s ohne Download: die Webseite öffnen und „Als App installieren“ wählen.
