# NULLPUNKT — Desktop-App bauen (desktop/, Electron + electron-builder).
# Läuft nur bei einem Versions-Tag (v1.2.3) oder von Hand (Actions → „Desktop-App bauen“ → Run workflow).
# Die Webseite (GitHub Pages) ist davon unabhängig und wird hier nicht angefasst.
# Ergebnis: Windows-Installer + portable .exe (und ein Linux-AppImage) als Artefakte; bei Tags zusätzlich als Release.
# Dateinamen ohne Versionsnummer (NULLPUNKT-Setup.exe, NULLPUNKT-portable.exe, NULLPUNKT-linux.AppImage), damit die
# Download-Knöpfe der Startseite (…/releases/latest/download/<Name>) immer auf die neueste Fassung zeigen.
name: Desktop-App bauen

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Versions-Tag für ein Release (z. B. v1.0.0) – leer = nur Artefakte bauen'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis portable --x64
            files: |
              desktop/dist/*.exe
          - os: ubuntu-latest
            target: --linux AppImage --x64
            files: |
              desktop/dist/*.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Abhängigkeiten
        run: npm ci --no-audit --no-fund

      - name: Version aus dem Tag übernehmen
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: npm version --no-git-tag-version --allow-same-version "${TAG#v}"

      - name: Bauen
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # Ohne Zertifikat wird nicht signiert (Windows zeigt dann die SmartScreen-Warnung, siehe docs/planung/desktop.md)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: nullpunkt-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

      - name: Release (bei Tags oder mit release_tag)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: NULLPUNKT ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ${{ matrix.files }}
          fail_on_unmatched_files: true
          body: |
            NULLPUNKT – kostenlos, ohne Konto. Alle Plattformen spielen zusammen.
            Windows: `NULLPUNKT-Setup.exe` (Installer) oder `NULLPUNKT-portable.exe` (ohne Installation) – nicht signiert, SmartScreen: „Weitere Informationen“ → „Trotzdem ausführen“.
            Linux: `NULLPUNKT-linux.AppImage` (ausführbar machen, starten).
            Android: `NULLPUNKT-android.apk` – Android fragt nach „Unbekannte Apps installieren“; für den Browser einmal erlauben.
            Leichter geht’s ohne Download: die Webseite öffnen und „Als App installieren“ wählen.
