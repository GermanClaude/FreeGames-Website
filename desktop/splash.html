<!doctype html>
<!-- NULLPUNKT – © 2026 German Legend. Alle Rechte vorbehalten. Siehe LICENSE.
     Startfenster der PC-App (Spielmenü 21.11.): wird von desktop/main.js als app://nullpunkt/__splash.html geladen,
     zeigt die echten Ladeschritte (App, Grafikkarte, Update-Prüfung, danach Spieldaten/Texturen der Startseite) und
     wechselnde Tipps. main.js ruft window.npStep({label, pct, ok}), window.npInfo({...}) und window.npDone(). -->
<html lang="de">
<head>
<meta charset="utf-8">
<title>NULLPUNKT</title>
<meta name="color-scheme" content="dark">
<style>
@font-face { font-family: 'Archivo NP'; src: url(/assets/fonts/archivo-var.woff2) format('woff2'); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: 'Rajdhani NP'; src: url(/assets/fonts/rajdhani-700.woff2) format('woff2'); font-weight: 700; }
@font-face { font-family: 'Rajdhani NP'; src: url(/assets/fonts/rajdhani-600.woff2) format('woff2'); font-weight: 600; }
@font-face { font-family: 'JetBrains Mono NP'; src: url(/assets/fonts/jetbrains-mono-var.woff2) format('woff2'); font-weight: 100 800; }
:root { --sig: #FF5B1F; --ink: #E4E7E2; --ink2: #A9B2B0; --dim: #7F8B89; --grid: rgba(150, 190, 180, .06); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  -webkit-app-region: drag; user-select: none; cursor: default;
  display: grid; grid-template-rows: auto 1fr auto; padding: 18px 26px 20px;
  background:
    radial-gradient(110% 90% at 50% 38%, rgba(32, 42, 44, .6), transparent 70%),
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 100% 36px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 36px 100%,
    #070909;
  color: var(--ink); font-family: 'Archivo NP', 'Segoe UI', Bahnschrift, 'Noto Sans', Arial, sans-serif;
  transition: opacity 380ms ease;
}
body.done { opacity: 0; }
body::before { content: ''; position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .25) 0 1px, transparent 1px 3px); }
body::after { content: ''; position: fixed; inset: 8px; pointer-events: none; border: 1px solid rgba(190, 212, 206, .14);
  -webkit-mask: linear-gradient(#000 0 0) top left / 26px 26px no-repeat, linear-gradient(#000 0 0) top right / 26px 26px no-repeat, linear-gradient(#000 0 0) bottom left / 26px 26px no-repeat, linear-gradient(#000 0 0) bottom right / 26px 26px no-repeat; }
.top { display: flex; gap: 18px; font: 600 11.5px/1 'Rajdhani NP', 'Segoe UI', sans-serif; letter-spacing: .2em; color: var(--ink2); text-transform: uppercase; }
.rec { display: inline-flex; align-items: center; gap: 7px; color: #fff; }
.rec::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #FF3B3B; box-shadow: 0 0 8px rgba(255, 59, 59, .8); animation: rec 1.6s steps(1) infinite; }
@keyframes rec { 50% { opacity: .15; } }
.conn { color: var(--sig); margin-left: auto; }
.conn.ok { color: #5FE08A; }
.mid { align-self: center; text-align: center; }
.mark { font-size: 84px; font-weight: 800; line-height: .85; letter-spacing: 0; color: #F0F2EE; animation: flick 1.2s steps(2) both; }
.mark b { color: var(--sig); font-weight: 800; }
@keyframes flick { 0% { opacity: 0; } 30% { opacity: .7; } 40% { opacity: .2; } 60%, 100% { opacity: 1; } }
.sub { margin-top: 10px; font: 600 12px/1 'Rajdhani NP', 'Segoe UI', sans-serif; letter-spacing: .42em; text-transform: uppercase; color: #8F9A98; }
.low { display: grid; gap: 7px; }
.step { display: flex; justify-content: space-between; gap: 12px; font: 700 12.5px/1.2 'Rajdhani NP', 'Segoe UI', sans-serif; letter-spacing: .12em; text-transform: uppercase; }
.step span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pct { font-family: 'JetBrains Mono NP', Consolas, monospace; color: var(--sig); letter-spacing: 0; }
.bar { position: relative; height: 5px; background: rgba(190, 212, 206, .14); overflow: hidden; }
.bar i { position: absolute; inset: 0; transform-origin: left; transform: scaleX(.02); background: linear-gradient(90deg, #C9471A, var(--sig) 70%, #FFB08A); transition: transform 320ms cubic-bezier(.16, 1, .3, 1); }
.log { list-style: none; display: grid; gap: 1px; height: 46px; overflow: hidden; font: 11px/1.35 'JetBrains Mono NP', Consolas, monospace; color: var(--dim); }
.log li::before { content: '✓ '; color: #5FE08A; }
.tip { min-height: 1.4em; font-size: 12.5px; color: #C9D0CE; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ver { position: fixed; right: 26px; bottom: 6px; font: 10px/1 'JetBrains Mono NP', Consolas, monospace; color: #5E6866; }
@media (prefers-reduced-motion: reduce) { .mark, .rec::before { animation: none; } .bar i { transition: none; } }
</style>
</head>
<body>
<p class="top" aria-hidden="true"><span class="rec">REC</span><span>Körperkamera 07</span><span>PC-App</span><span class="conn" id="conn">Verbindung wird aufgebaut</span></p>
<div class="mid">
  <p class="mark">NULLPUNKT<b>.</b></p>
  <p class="sub">Realistischer Ego-Shooter</p>
</div>
<div class="low">
  <p class="step"><span id="step">Start …</span><span class="pct" id="pct">0 %</span></p>
  <div class="bar"><i id="fill"></i></div>
  <ol class="log" id="log"></ol>
  <p class="tip" id="tip"></p>
</div>
<p class="ver" id="ver"></p>
<script>
(function () {
  var pct = 0;
  var $ = function (id) { return document.getElementById(id); };
  window.npStep = function (s) {
    if (!s) return;
    pct = Math.max(pct, Math.min(100, Number(s.pct) || 0));
    if (s.label) $('step').textContent = s.label;
    $('pct').textContent = Math.round(pct) + ' %';
    $('fill').style.transform = 'scaleX(' + (pct / 100).toFixed(3) + ')';
    if (s.ok && s.label) {
      var li = document.createElement('li');
      li.textContent = s.label;
      $('log').appendChild(li);
      while ($('log').children.length > 3) $('log').removeChild($('log').firstChild);
    }
  };
  window.npInfo = function (i) { if (i) $('ver').textContent = 'App ' + (i.version || '?') + ' · Fassung ' + (i.build || '?'); };
  window.npDone = function () {
    window.npStep({ label: 'Bereit.', pct: 100 });
    var c = $('conn'); c.textContent = 'Verbindung steht'; c.className = 'conn ok';
    setTimeout(function () { document.body.className = 'done'; }, 60);
  };
  var tips = ['Tipp: Gehockt und still stehend streut jede Waffe am wenigsten.'];
  var k = 0;
  function nextTip() { $('tip').textContent = tips[k++ % tips.length]; }
  nextTip();
  setInterval(nextTip, 2600);
  // Tipps aus denselben Texten wie die Startseite (site/strings.de.js)
  import('/assets/js/site/strings.de.js').then(function (m) {
    var t = m && m.STRINGS && m.STRINGS.tips;
    if (t && t.length) { tips = t.slice(); k = Math.floor(Math.random() * tips.length); nextTip(); }
  }).catch(function () {});
})();
</script>
</body>
</html>
